name: WattBench
options:
  bundleIdPrefix: com.thebench
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: CC8X33MU92
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WattBench:
    type: application
    platform: iOS
    sources:
      - path: WattBench
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebench.wattbench
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: WattBench
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: WattBench/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Bluetooth is used to connect to your FNIRSI FNB58 power meter and receive its live voltage, current and power readings. While a recording is in progress the connection stays active in the background so the recording continues with the screen locked.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - bluetooth-central
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  WattBenchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WattBenchTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: WattBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebench.wattbench.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WattBench:
    build:
      targets:
        WattBench: all
        WattBenchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WattBenchTests
    archive:
      config: Release
