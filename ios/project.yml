name: FNB58Monitor
options:
  bundleIdPrefix: com.thebench
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: CC8X33MU92
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FNB58Monitor:
    type: application
    platform: iOS
    sources:
      - path: FNB58Monitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebench.fnb58monitor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: FNB58
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: FNB58Monitor/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: FNB58 Monitor connects to your FNIRSI FNB58 power meter over Bluetooth to show live voltage, current and power.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  FNB58MonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FNB58MonitorTests
    dependencies:
      - target: FNB58Monitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebench.fnb58monitor.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FNB58Monitor:
    build:
      targets:
        FNB58Monitor: all
        FNB58MonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FNB58MonitorTests
